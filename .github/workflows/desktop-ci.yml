name: GA backend contracts

"on":
  push:
    branches: [main]
    paths: ["agentmain.py", "llmcore.py", "llmcore/**", "frontends/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["agentmain.py", "llmcore.py", "llmcore/**", "frontends/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: frontends/tests/requirements.txt
      - run: python -m pip install -r frontends/tests/requirements.txt
      - name: Run bridge, conductor, cost and backup contracts
        # These two legacy suites describe the removed bundled Desktop shell,
        # not the GA backend. Do not fetch private Desktop source to run them.
        run: >-
          python -m pytest frontends/tests -q
          --ignore=frontends/tests/test_release_qualification.py
          --ignore=frontends/tests/test_tauri_security_contract.py
      - name: Verify Desktop remains an unlinked placeholder
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' frontends/desktop/.gitignore frontends/desktop/README.md)
          test "$(git ls-files frontends/desktop)" = "$expected"
